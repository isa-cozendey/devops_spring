spring.application.name=bikes
server.port=${SERVER_PORT:8080}
# LOCALE config
spring.web.locale-resolver=fixed
spring.web.locale=pt_BR

# MYSQL Config
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/bikes?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# JPA
# exibe sql no log
spring.jpa.show-sql=true 
# exibe em uma única linha
spring.jpa.properties.hibernate.format_sql=false
# cria as tabelas a partir das classes entidades
spring.jpa.hibernate.ddl-auto=update

# Actuator and Prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# Structured application logs sent to Graylog GELF/UDP.
logging.config=classpath:logback-spring.xml
graylog.host=${GRAYLOG_HOST:localhost}
graylog.port=${GRAYLOG_PORT:12201}

#SWAGGER
springdoc.swagger-ui.path=/docs-bikes.html
# Código gerado para acessar a documentação da API no Swagger UI: http://localhost:8080/docs-bikes.html
springdoc.api-docs.path=/docs-bikes
springdoc.packages-to-scan=br.edu.ifc.bikes.web.controller